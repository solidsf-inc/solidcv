[package]
name = "solidcv-app"
version = "0.1.0"
edition = "2021"
authors = ["Andy Norris <andy@solidsf.com>", "solidSF <engineering@solidsf.com>"]
license = "Apache-2.0"
description = "solidcv + SuperMimic Live Webcam-to-3D Humanoid & Voxelean Worldtube Studio (native egui + wasm32 WebHandle for app.solidsf.com)"

[workspace]

[lib]
name = "solidcv_app"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "solidcv-app"
path = "src/main.rs"

[dependencies]
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "0.31"
solidcv = { path = ".." }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
